services:
  logger.channel.shipping_integration:
    parent: logger.channel_base
    arguments: ["shipping_integration"]

  plugin.manager.shipping_providers:
    class: Drupal\shipping_integration\ShippingProvidersPluginManager
    parent: default_plugin_manager

  shipping_integration.get_config:
    class: Drupal\shipping_integration\Service\GetConfigShipping
    arguments:
      - "@plugin.manager.shipping_providers"
      - "@entity_type.manager"
      - "@messenger"
      - "@logger.channel.shipping_integration"
      - "@datetime.time"

  shipping_integration.handle_shipping:
    class: Drupal\shipping_integration\Service\HandleShipping
    arguments:
      - "@plugin.manager.shipping_providers"
      - "@shipping_integration.get_config"
      - "@entity_type.manager"
      - "@file_system"
      - "@file.repository"
      - "@logger.channel.shipping_integration"
      - "@datetime.time"

  shipping_integration.synchronize_addresses:
    class: Drupal\shipping_integration\Service\SynchronizeAddresses
    arguments:
      - "@plugin.manager.shipping_providers"
      - "@shipping_integration.get_config"
      - "@entity_type.manager"
      - "@logger.channel.shipping_integration"
      - "@database"

  shipping_integration.order_service:
    class: Drupal\shipping_integration\ShippingOrderService
    arguments:
      - "@entity_type.manager"
      - "@entity_field.manager"

  shipping_integration.address_options:
    class: Drupal\shipping_integration\Service\AddressOptions
    arguments:
      - "@entity_type.manager"

  shipping_integration.webhook_receiver:
    class: Drupal\shipping_integration\Service\WebhookReceiver
    arguments:
      - "@shipping_integration.handle_shipping"
      - "@entity_type.manager"
      - "@logger.channel.shipping_integration"
